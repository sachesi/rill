[package]
name = "rill"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "A small BitTorrent client"
repository = "https://github.com/sachesi/rill"
readme = "README.md"

[dependencies]
mtorrent = "0.7.2"
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
async-channel = "2"
log = "0.4"
env_logger = "0.11"
dirs-next = "2"
urlencoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sha1 = "0.11"
ksni = { version = "0.3.4", default-features = false, features = ["blocking", "async-io"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1

# mtorrent installs a debug-only panic hook in `single_torrent` that turns any panic
# into `process::exit(1)`, which ends debug builds in the middle of a download. Turning
# debug assertions off for the crate compiles the hook out and leaves Rill's own
# assertions on.
[profile.dev.package.mtorrent]
debug-assertions = false
